# evaluation/config/model_config.yaml
model:
  inference:
    use_flash_attention: true
    use_kv_cache: true
    quantization:
      enabled: false
      bits: 4
      method: "gptq"

  sampling_strategies:
    - name: "greedy"
      temperature: 0.0
      top_p: 1.0
    - name: "diverse"
      temperature: 0.7
      top_p: 0.9
      top_k: 50
    - name: "creative"
      temperature: 1.0
      top_p: 0.95
      top_k: 100

  variants:
    - name: "base"
      path: "./Qwen2.5-0.5B"
    - name: "finetuned_v1"
      path: "./output/checkpoint-1000"
    - name: "finetuned_v2"
      path: "./output/final-lora"
